[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-detector"
version = "0.1.0"
description = "Local AI agent runtime and component detector (Linux first, cross-platform dev)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "psutil>=6.0,<8.0",
  "httpx>=0.27,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pyyaml>=6.0,<7.0"
]

[project.scripts]
agent-detector = "agent_detector.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_detector.web" = ["index.html"]
"agent_detector.fingerprints" = ["rules/*.yaml"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
