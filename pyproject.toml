[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-detector"
version = "0.2.0"
description = "Windows-first local AI agent discovery, behavior monitoring and pre-execution interception"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "psutil>=6.0,<8.0",
  "httpx>=0.27,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pyyaml>=6.0,<7.0"
]
# Sysmon collection uses ctypes + wevtapi.dll, so pywin32 is not required.

[project.scripts]
agent-detector = "agent_detector.console.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_detector.console.web" = ["index.html", "assets/**/*"]
"agent_detector.discovery" = ["data/*.yaml", "data/fingerprints/*.yaml"]
"agent_detector.interception" = ["data/*.yaml"]
"agent_detector.monitoring" = ["data/*.yaml"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Third-party deprecations (starlette/anyio) are noise for this suite; our own
# warnings stay visible.
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The `anyio.abc.BlockingPortal` alias is deprecated",
]