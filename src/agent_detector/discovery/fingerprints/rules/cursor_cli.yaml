# =============================================================================
# Cursor CLI（Anysphere 官方终端 Agent，cursor-agent）
# =============================================================================
# 本文件是纯声明式数据：引擎按这里的描述去探测，不在代码里写死任何产品特征。
# 修改本文件后无需改代码，下一次扫描即生效。
#
# 已核实的产品事实（2026-10，来源：cursor.com/install 安装脚本（Unix 版与
# ?win32=true 的 PowerShell 版）、cursor.com/docs/cli、Windows 实机验证）：
#   * Unix（macOS/Linux/WSL）：`curl https://cursor.com/install -fsS | bash`，
#     各版本解压到 ~/.local/share/cursor-agent/versions/<版本>/，符号链接
#     ~/.local/bin/agent（主命令）与 ~/.local/bin/cursor-agent（旧名）。
#   * Windows 原生：`irm 'https://cursor.com/install?win32=true' | iex`，
#     布局完全不同 —— 安装根目录是 %LOCALAPPDATA%\cursor-agent\，版本目录
#     versions\<版本>\（日历版本命名，两平台一致），根目录有 cursor-agent.exe
#     与 agent.exe 别名副本；PATH 指向该根目录。
#   * **进程形态**：Unix 上进程名 cursor-agent（经 agent 链接调用时 comm
#     可能是 agent）；**Windows 上真正的 agent 进程是捆绑的 node.exe**
#     （versions\<ver>\node.exe，实机验证：cursor-agent 会话在终端里开着时
#     进程表只有 node.exe，没有任何 cursor-agent.exe）—— 精确可执行名匹配
#     在 Windows 上必然落空，运行证据主要靠路径 token。
#   * 版本目录名是日历版本（如 2026.10.19-6bbf2c4）——数字形态恰好符合
#     引擎的 semver 目录探测，且日历版本单调递增，"取最新"逻辑成立。
#   * CLI 全局配置：~/.cursor/cli-config.json（Windows 为
#     %USERPROFILE%\.cursor\cli-config.json）；登录走浏览器流（cursor-agent
#     login）或 CURSOR_API_KEY 环境变量，状态存于 ~/.cursor。
#
# 刻意的范围决策：
#   * 本规则只覆盖 cursor-agent CLI。Cursor IDE（Electron 桌面应用，进程
#     Cursor.exe）是同一产品家族的另一面，但"IDE 装着"不等于"Agent 在跑"，
#     不做进程匹配；~/.cursor 目录主体属于 IDE（扩展、MCP 配置），也不作为
#     CLI 安装证据，避免把仅装 IDE 的机器误报成 CLI。
#   * 规则 id 用 "cursor"：与 agents.yaml 矩阵条目、hooks 适配器（Cursor
#     Adapter）和 ~/.cursor/hooks.json 的 Hook 追踪路径对齐。
#
# 证据与隐私约定（与 claude_code.yaml 相同）：
#   * 所有探测均为只读 —— 不执行被发现的程序，不读取文件内容；
#   * 进程命令行会经脱敏（token 类字符串打码）后截断存证。
#
# '~' 表示被扫描用户的 home 目录；confidence 为该证据的可信度（0~1）。
# =============================================================================
kind: client_rule
id: cursor               # 与矩阵条目 / Hook 适配器 / Hook 追踪路径同名
name: Cursor CLI
asset_type: AGENT_CLIENT
revision: 1

# -----------------------------------------------------------------------------
# 安装证据（INSTALLED）—— 存在以下任意一项即认为安装过
# -----------------------------------------------------------------------------
install:
  # 二进制符号链接（旧名，名字无歧义）。主链接 ~/.local/bin/agent 刻意不作为
  # 安装证据：普通用户自建的 scripts 也可能叫 agent，存在性证明不了 Cursor。
  paths:
    - path: '~/.local/bin/cursor-agent'
      confidence: 0.85

  # 安装器的版本目录：名字高度特异（cursor-agent 全名），个人文件不会撞名。
  # Unix 在 ~/.local/share，Windows 原生在 %LOCALAPPDATA%（安装根目录，
  # 根下同时有 versions\ 与 cursor-agent.exe / agent.exe 别名副本）。
  dirs:
    - path: '~/.local/share/cursor-agent'
      confidence: 0.85
    - path: '~/AppData/Local/cursor-agent'
      confidence: 0.85

# -----------------------------------------------------------------------------
# 版本来源 —— 命中即停；全部失败输出 UNKNOWN（禁止猜测）
# -----------------------------------------------------------------------------
version:
  # 官方仅脚本安装、无 npm 元数据，版本目录是唯一可靠来源。
  # 目录名形如 2026.10.19-6bbf2c4，引擎取数字三元组最大者（日历版本单调）。
  # Unix 与 Windows 原生（%LOCALAPPDATA%）两套布局都探测。
  - from: semver_dir_entries
    dirs:
      - '~/.local/share/cursor-agent/versions'
      - '~/AppData/Local/cursor-agent/versions'
    source: installer-metadata
    confidence: 0.8

# -----------------------------------------------------------------------------
# 配置证据（CONFIGURED）—— 只看存在性，不读内容
# -----------------------------------------------------------------------------
config:
  # cli-config.json 是 CLI 专属全局配置，只有用户真正配置过才会出现；
  # ~/.cursor 下其余内容（扩展、mcp.json 等）属于 IDE，不计入。
  existing_files:
    - path: '~/.cursor/cli-config.json'
      confidence: 0.8

# -----------------------------------------------------------------------------
# 运行证据（RUNNING）—— 进程匹配
# -----------------------------------------------------------------------------
process:
  # 可执行文件名精确匹配：覆盖 Unix 二进制与 Windows 根目录的启动器副本。
  # 注意 Windows 上真正的 agent 进程是捆绑的 node.exe（见文件头），精确名
  # 匹配在 Windows 必然落空 —— 运行证据主要靠下面的路径 token。
  # 刻意不含 "agent"：作为独立进程名过于泛化，误报不可控。
  executable_names: [cursor-agent, cursor-agent.exe]

  # 命令行中出现的路径片段（子串匹配，反斜杠已归一化为 /）：
  #   * cursor-agent/versions —— 版本目录内的真实二进制（Unix 的
  #     .local/share/cursor-agent/versions/ 与 Windows 的
  #     AppData/Local/cursor-agent/versions/ 一并覆盖；Windows 的 node.exe
  #     进程 argv[0] 指向这里，是实机验证过的主命中路径）；
  #   * local/cursor-agent —— Windows 安装根目录下的启动器（cursor-agent.exe
  #     / agent.exe 副本被直接调用时的路径）；
  #   * .local/bin/cursor-agent、.local/bin/agent —— Unix 符号链接的调用
  #     路径（agent 链接的进程 comm 可能是 "agent"，argv[0] 路径兜住；该
  #     路径由安装脚本 rm -f 后重建，Cursor 装机后必为 Cursor 所有）。
  # 全部带路径上下文，裸 "cursor-agent" / "agent" 单词不作数。
  cmdline_tokens: ['cursor-agent/versions', 'local/cursor-agent',
                   '.local/bin/cursor-agent', '.local/bin/agent']

  # 排除指纹：暂无已知同名额产品（与 Claude Desktop 情形不同）；Cursor IDE
  # 进程名 Cursor/Cursor.exe 与精确名匹配不相交。
  exclude_patterns: []

  confidence: 0.85

# -----------------------------------------------------------------------------
# 置信度合成：base + 各状态权重之和，封顶 cap。状态可并存（文档 §2.3）
# -----------------------------------------------------------------------------
confidence:
  base: 0.5
  installed: 0.2
  configured: 0.2
  running: 0.25
  cap: 0.95
