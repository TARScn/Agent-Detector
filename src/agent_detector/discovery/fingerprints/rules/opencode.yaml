# =============================================================================
# OpenCode（开源终端编码 Agent，opencode-ai）
# =============================================================================
# 本文件是纯声明式数据：引擎按这里的描述去探测，不在代码里写死任何产品特征。
# 修改本文件后无需改代码，下一次扫描即生效。
#
# 已核实的产品事实（2026-10，来源：opencode.ai/install 安装脚本、
# opencode.ai/docs/config、opencode.ai/docs/cli）：
#   * 安装脚本把二进制放到 ~/.opencode/bin/opencode（Windows 下经 Git Bash /
#     MINGW 运行同一脚本，为 opencode.exe）；脚本不保留版本目录（下载即装），
#     所以没有目录式版本来源。
#   * npm 全局包为 opencode-ai，package.json 的 version 是最可靠的版本来源。
#   * 全局配置 ~/.config/opencode/opencode.json（.jsonc 亦支持 —— JSONC 带
#     注释时 JSON 键名探测会失败，因此只做存在性判断）。
#   * 凭据与数据在 ~/.local/share/opencode/（auth.json 由 `opencode auth
#     login` 生成；凭据文件只 stat 存在性，键名与值都不读）。
#
# 已知边界：
#   * Windows 原生渠道（Scoop 等第三方分发）的安装位置未经核实，不在探测
#     范围内 —— 这类机器靠进程名匹配兜住 RUNNING 状态。
#   * 无 Hook 适配器（agents.yaml：protect=PLANNED）：本规则只服务发现与
#     监测归因，不声称保护。
#
# 证据与隐私约定（与 claude_code.yaml 相同）：
#   * 所有探测均为只读 —— 不执行被发现的程序，不读取文件内容；
#   * 进程命令行会经脱敏（token 类字符串打码）后截断存证。
#
# '~' 表示被扫描用户的 home 目录；confidence 为该证据的可信度（0~1）。
# =============================================================================
kind: client_rule
id: opencode            # 与 agents.yaml 矩阵条目同名
name: OpenCode
asset_type: AGENT_CLIENT
revision: 1

# -----------------------------------------------------------------------------
# 安装证据（INSTALLED）—— 存在以下任意一项即认为安装过
# -----------------------------------------------------------------------------
install:
  npm_packages:
    - package: 'opencode-ai'
      confidence: 0.9

  # 安装器的 bin 目录：名字高度特异（.opencode），个人文件不会撞名。
  paths:
    - path: '~/.opencode/bin/opencode'
      confidence: 0.85
    - path: '~/.opencode/bin/opencode.exe'
      confidence: 0.85

  # 安装目录与首次运行的数据目录（auth.json / 会话数据的宿主）。
  dirs:
    - path: '~/.opencode'
      confidence: 0.8
    - path: '~/.local/share/opencode'
      confidence: 0.8

# -----------------------------------------------------------------------------
# 版本来源 —— 命中即停；全部失败输出 UNKNOWN（禁止猜测）
# -----------------------------------------------------------------------------
version:
  # 安装脚本不保留版本目录，npm 元数据是唯一可靠来源。
  - from: npm_package_json
    source: package-metadata
    confidence: 0.9

# -----------------------------------------------------------------------------
# 配置证据（CONFIGURED）—— 只看存在性，不读内容
# -----------------------------------------------------------------------------
config:
  # opencode.json 支持带注释的 JSONC，键名探测不可靠，只做存在性判断。
  # auth.json 在用户登录后生成 —— 真实使用过的强证据；凭据文件只 stat。
  existing_files:
    - path: '~/.config/opencode/opencode.json'
      confidence: 0.8
    - path: '~/.config/opencode/opencode.jsonc'
      confidence: 0.8
    - path: '~/.local/share/opencode/auth.json'
      confidence: 0.7

# -----------------------------------------------------------------------------
# 运行证据（RUNNING）—— 进程匹配
# -----------------------------------------------------------------------------
process:
  # 可执行文件名精确匹配。
  executable_names: [opencode, opencode.exe]

  # 命令行路径片段（子串匹配）：安装器 bin 目录的调用路径 + npm 包目录。
  # 刻意不用裸 "opencode" token：项目目录叫 opencode 的场景（编辑器打开
  # opencode 仓库）会造成误报。
  cmdline_tokens: ['.opencode/bin', 'opencode-ai']

  # 排除指纹：暂无已知同名额产品；未发现类似 Claude Desktop 的同名不同产品。
  exclude_patterns: []

  confidence: 0.85

# -----------------------------------------------------------------------------
# 置信度合成：base + 各状态权重之和，封顶 cap。状态可并存（文档 §2.3）
# -----------------------------------------------------------------------------
confidence:
  base: 0.5
  installed: 0.2
  configured: 0.2
  running: 0.25
  cap: 0.95
