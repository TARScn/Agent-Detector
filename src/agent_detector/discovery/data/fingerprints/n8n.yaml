# =============================================================================
# n8n（工作流自动化 + AI Agent 平台）检测规则
# =============================================================================
# 本文件是纯声明式数据：引擎按这里的描述去探测，不在代码里写死任何产品特征。
# 修改本文件后无需改代码，下一次扫描即生效。
#
# 已核实的产品事实（2026-10-26，来源：本机 Docker 官方镜像 n8nio/n8n 实勘；
# 宿主 npm 全局安装布局来自 n8n 官方文档）：
#   * 宿主形态：npm install -g n8n → <npm 全局根>/n8n（Windows
#     %APPDATA%\npm\node_modules、Linux /usr/local|usr/lib/node_modules、
#     npm root -g 兜底，见 engine.npm_global_roots）；启动 shim 是
#     n8n.cmd / n8n（shell 脚本），进程名是 node —— 按命令行里的包路径
#     片段匹配；
#   * 容器形态：官方镜像把整棵依赖树打进 /usr/local/lib/node_modules/n8n
#     （嵌套 node_modules 内含 @langchain/core 等 AI 依赖），进程被改名
#     为 n8n（tini 启动），WORKDIR /home/node，数据目录 /home/node/.n8n；
#   * AI Agent 能力基于 LangChain（@langchain/core 嵌套依赖，已并入
#     framework_langchain.yaml 的 any 名单）—— 容器内并存产出 n8n 平台
#     资产与 LangChain 框架资产（资产口径是依赖，2026-10-26 用户裁定）。
#
# 证据与隐私约定（与 claude_code.yaml 相同）：
#   * 所有探测均为只读 —— 不执行被发现的程序，不读取文件内容；
#   * n8n 的凭据与工作流数据存在 ~/.n8n/database.sqlite，只 stat 存在性，
#     永不读取内容（含键名）；
#   * 进程命令行会经脱敏（token 类字符串打码）后截断存证。
#
# '~' 表示被扫描用户的 home 目录；confidence 为该证据的可信度（0~1）。
# =============================================================================
kind: client_rule
id: n8n                # 与 agents.yaml 矩阵条目对齐
name: n8n
asset_type: AGENT_PLATFORM
revision: 1

# -----------------------------------------------------------------------------
# 安装证据（INSTALLED）—— 存在以下任意一项即认为安装过
# -----------------------------------------------------------------------------
install:
  # npm 全局包：package.json 的 version 字段是最可靠的版本来源。
  npm_packages:
    - package: 'n8n'
      confidence: 0.9

  # 数据目录：首次运行即创建；即使包被卸载，目录残留仍证明安装过。
  dirs:
    - path: '~/.n8n'
      confidence: 0.8

# -----------------------------------------------------------------------------
# 版本来源 —— 按优先级自上而下尝试，命中即停；全部失败输出 UNKNOWN（禁止猜测）
# -----------------------------------------------------------------------------
version:
  # npm 包的 package.json（已安装包的实际版本）。无 --version 执行兜底：
  # 启动 shim 是 .cmd / shell 脚本（无 shell 不能执行），npm 元数据已是
  # 可靠来源。
  - from: npm_package_json
    source: package-metadata
    confidence: 0.9

# -----------------------------------------------------------------------------
# 配置证据（CONFIGURED）—— 只读存在性 / JSON 顶层键名，永不读值
# -----------------------------------------------------------------------------
config:
  existing_files:
    # 数据库在首次运行时创建：比目录更强的"实际使用过"证据；
    # 只 stat 存在性，永不读取（凭据与工作流内容都在里面）。
    - path: '~/.n8n/database.sqlite'
      confidence: 0.8

# -----------------------------------------------------------------------------
# 运行证据（RUNNING）—— 进程匹配
# -----------------------------------------------------------------------------
process:
  # 宿主：node .../node_modules/n8n/...（shim 拉起，进程名是 node）；
  # executable_names 覆盖直接以 n8n 为名的进程（容器内二进制被改名）。
  # 裸 "n8n" 单词不作数 —— grep 类误报过宽，与 claude/openclaw 同口径。
  executable_names: [n8n, n8n.exe, n8n.cmd]
  cmdline_tokens:
    - 'node_modules/n8n'
  confidence: 0.85

# -----------------------------------------------------------------------------
# 容器内布局（Docker 通道通用容器 client 机制读取；路径为容器内部绝对路径）
# -----------------------------------------------------------------------------
container:
  package: 'n8n'
  npm_roots:
    - '/usr/local/lib/node_modules'
    - '/usr/lib/node_modules'
  config_existing:
    - '/home/node/.n8n'
  process_tokens:
    # 首段可执行名精确等于 'n8n'（容器内二进制改名）即命中；
    # 子串匹配兜底 node 原样拉起的宿主形态。
    - 'n8n'
  image_keywords:
    - n8n

# -----------------------------------------------------------------------------
# 置信度合成：base + 各状态权重之和，封顶 cap。状态可并存（文档 §2.3）
# -----------------------------------------------------------------------------
confidence:
  base: 0.5
  installed: 0.2
  configured: 0.2
  running: 0.25
  cap: 0.95
