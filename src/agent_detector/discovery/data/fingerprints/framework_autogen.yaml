# =============================================================================
# AutoGen（微软多 Agent 框架）检测规则 —— kind: framework_rule
# =============================================================================
# 包名跨越两代：0.2.x 时代装 pyautogen，0.4+ 拆成 autogen-agentchat /
# autogen-core 等。按归一化包名任一命中即认定框架环境。
# =============================================================================
kind: framework_rule
id: autogen
name: AutoGen
vendor: Microsoft
revision: 1
runtimes: [python]

dependencies:
  any:
    - autogen-agentchat
    - autogen-core
    - pyautogen

confidence:
  base: 0.45
  installed: 0.3
  configured: 0.1
  running: 0.25
  cap: 0.9
