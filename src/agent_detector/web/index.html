<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Agent Detector · 本机 AI Agent 安全控制台</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%230f6cbd' d='M10 2.5 16.5 5v5.2c0 3.6-2.7 6.5-6.5 7.3-3.8-.8-6.5-3.7-6.5-7.3V5L10 2.5Z'/></svg>">
</head>
<body>
  <div id="root" class="app"></div>
  <noscript>本控制台需要启用 JavaScript。</noscript>
  <script>
    // Startup diagnostics: the console has no build step, so a module error would
    // otherwise only appear in the browser console. Recorded errors are shown by
    // app.js if the UI failed to boot.
    window.__agentDetectorErrors = [];
    const record = (message) => {
      window.__agentDetectorErrors.push(message);
      const root = document.getElementById('root');
      if (root && !root.childElementCount) {
        root.innerHTML = '<div class="page" style="padding:32px"><div class="card">'
          + '<div class="card-head"><h2>控制台启动失败</h2></div>'
          + '<div class="card-body"><p>请查看浏览器控制台的错误详情，或刷新页面重试。</p>'
          + '<pre class="code">' + String(message).replace(/[<>&]/g, '') + '</pre></div></div></div>';
      }
    };
    window.addEventListener('error', (event) => record(
      `${event.message} @ ${event.filename || ''}:${event.lineno || 0}`));
    window.addEventListener('unhandledrejection', (event) => record(
      `未处理的 Promise 拒绝：${event.reason && (event.reason.stack || event.reason.message) || event.reason}`));
  </script>
  <script type="module">
    import { boot } from './assets/js/app.js';
    boot();
  </script>
</body>
</html>
